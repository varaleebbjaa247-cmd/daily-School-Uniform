<!-- ส่วนแสดงผลและแก้ไขการแต่งกายประจำวัน -->
<div class="outfit-section" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
  <h3>👕 จัดการการแต่งกายประจำสัปดาห์</h3>
  
  <div style="display: grid; gap: 10px; max-width: 400px;">
    <label>วันจันทร์: <input type="text" id="outfit-Monday" value="ชุดนักเรียน"></label>
    <label>วันอังคาร: <input type="text" id="outfit-Tuesday" value="ชุดนักเรียน"></label>
    <label>วันพุธ: <input type="text" id="outfit-Wednesday" value="ชุดพละ"></label>
    <label>วันพฤหัสบดี: <input type="text" id="outfit-Thursday" value="ชุดลูกเสือ"></label>
    <label>วันศุกร์: <input type="text" id="outfit-Friday" value="ชุดผ้าไทย"></label>
    <label>วันเสาร์: <input type="text" id="outfit-Saturday" value="วันหยุด ไม่ต้องแต่งชุดนักเรียน"></label>
    <label>วันอาทิตย์: <input type="text" id="outfit-Sunday" value="วันหยุด ไม่ต้องแต่งชุดนักเรียน"></label>
  </div>

  <button onclick="saveOutfitConfig()" style="margin-top: 15px; padding: 8px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
    💾 บันทึกชุดแต่งกายลง outfit.json
  </button>
</div>

<script>
// ฟังก์ชันสร้าง Object โครงสร้าง outfit.json
function getOutfitDataFromInputs() {
  return {
    schedule: {
      Monday: document.getElementById('outfit-Monday').value,
      Tuesday: document.getElementById('outfit-Tuesday').value,
      Wednesday: document.getElementById('outfit-Wednesday').value,
      Thursday: document.getElementById('outfit-Thursday').value,
      Friday: document.getElementById('outfit-Friday').value,
      Saturday: document.getElementById('outfit-Saturday').value,
      Sunday: document.getElementById('outfit-Sunday').value
    }
  };
}

// ฟังก์ชันบันทึกข้อมูลไปยัง outfit.json บน GitHub ผ่าน API
async function saveOutfitConfig() {
  const token = localStorage.getItem('github_token'); // หรือตำแหน่งที่คุณเก็บ Access Token ไว้
  if (!token) {
    alert('กรุณาใส่ GitHub Access Token ก่อนบันทึกครับ');
    return;
  }

  const repo = 'varaleebbjaa247-cmd/daily-School-Uniform';
  const path = 'outfit.json';
  const url = `https://api.github.com/repos/${repo}/contents/${path}`;

  try {
    // 1. ดึง sha ของไฟล์เดิมก่อน
    const getRes = await fetch(url, {
      headers: { 'Authorization': `token ${token}` }
    });
    const fileData = await getRes.json();
    const sha = fileData.sha;

    // 2. แปลง JSON ใหม่เป็น Base64
    const newContent = JSON.stringify(getOutfitDataFromInputs(), null, 2);
    const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

    // 3. ส่งคำขอ PUT เพื่ออัปเดตไฟล์ outfit.json
    const putRes = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Update outfit.json via web UI',
        content: encodedContent,
        sha: sha
      })
    });

    if (putRes.ok) {
      alert('บันทึกชุดแต่งกายเรียบร้อยแล้วครับ!');
    } else {
      alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
    }
  } catch (err) {
    console.error(err);
    alert('ไม่สามารถเชื่อมต่อกับ GitHub API ได้');
  }
}
</script>
